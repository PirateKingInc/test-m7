name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # push the built site to the gh-pages branch
  pages: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests must pass before deploying
        run: npm test
      - name: Assemble static site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r src _site/
          touch _site/.nojekyll
      - name: Publish to gh-pages branch
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
      - name: Make sure Pages serves the gh-pages branch
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .html_url; then
            gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" --jq .status || true
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/pages" \
              -f "source[branch]=gh-pages" -f "source[path]=/" --jq .html_url
          fi
