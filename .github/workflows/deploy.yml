name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Tests must pass before deploying
        run: npm test
      - name: Assemble static site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r src _site/
          touch _site/.nojekyll
      - name: Make sure Pages builds from GitHub Actions
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          api="repos/${GITHUB_REPOSITORY}/pages"
          if [ "$(gh api "$api" --jq .build_type)" != "workflow" ]; then
            gh api -X PUT "$api" -f build_type=workflow || gh api -X POST "$api" -f build_type=workflow
          fi
          gh api "$api" --jq '{build_type, status, html_url}'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Poll the live URL until it serves the game
        env:
          URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o page.html -w '%{http_code}' "$URL" || true)
            echo "attempt $i: HTTP $code"
            if [ "$code" = 200 ] && grep -q 'Kindlewing' page.html; then
              echo "Live: $URL"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$URL did not serve the game within 10 minutes"
          exit 1
